name: MECA Approval Poller

# Reads the owner's Telegram Approve/Cancel taps on staged parts orders
# (approve.py). Approval can lag by up to ~15 minutes.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

# Same group as bookings.yml: the two jobs must never overlap (shared
# config/orders.json, one pro.meca.se cart, agent.py's start-of-run sweep).
concurrency:
  group: meca-bookings
  cancel-in-progress: false

permissions:
  contents: write                  # commit config/orders.json back

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Stdlib only: nothing installed yet. Most runs stop here.
      - name: Anything pending?
        id: check
        run: python approve.py --check

      - name: Install dependencies
        if: ${{ steps.check.outputs.has_pending == 'true' }}
        run: pip install -r requirements.txt

      - name: Install Chromium
        if: ${{ steps.check.outputs.has_pending == 'true' }}
        run: python -m playwright install --with-deps chromium

      - name: Handle approvals
        if: ${{ steps.check.outputs.has_pending == 'true' }}
        env:
          # PORTAL_* are not used here, but config_loader requires them.
          PORTAL_USERNAME:       ${{ secrets.PORTAL_USERNAME }}
          PORTAL_PASSWORD:       ${{ secrets.PORTAL_PASSWORD }}
          TELEGRAM_BOT_TOKEN:    ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:      ${{ secrets.TELEGRAM_CHAT_ID }}
          PARTS_PORTAL_USERNAME: ${{ secrets.PARTS_PORTAL_USERNAME }}
          PARTS_PORTAL_PASSWORD: ${{ secrets.PARTS_PORTAL_PASSWORD }}
          ANTHROPIC_API_KEY:     ${{ secrets.ANTHROPIC_API_KEY }}
        run: python approve.py

      - name: Persist state back to repo
        if: ${{ always() }}
        run: |
          git config user.name  "meca-agent[bot]"
          git config user.email "meca-agent[bot]@users.noreply.github.com"
          git add config/orders.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "chore: update order state [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying."
            sleep $((attempt * 5))
          done
          echo "Could not push state after 3 attempts."
          exit 1

# ─────────────────────────────────────────────
#  MECA Agent — Configuration TEMPLATE
#
#  LOCAL DEV ONLY. Copy this to config/config.yaml
#  and fill in your real credentials:
#
#     cp config/config.example.yaml config/config.yaml
#
#  config/config.yaml is gitignored and must NEVER be committed.
#
#  In GitHub Actions there is NO config.yaml — every value below
#  is supplied as a GitHub Secret / env var instead (see README).
#  The env var name for each field is shown in the comment; a set
#  env var always wins over the yaml value.
#
#  Parts-ordering RULES (preferred/forbidden brands, the 10,000 SEK
#  ceiling, approve/auto mode) are NOT here: they live in
#  parts_rules.yaml in the repo root, which the owner edits directly.
#
#  Sections not listed here (e.g. an old sms: or email_agent: block)
#  are ignored.
# ─────────────────────────────────────────────

# ── MECA ProMeister Portal (bookings) — required ───────────────────────────
portal:
  username: "YOUR_MECA_LOGIN"          # env: PORTAL_USERNAME
  password: "YOUR_MECA_PASSWORD"       # env: PORTAL_PASSWORD
  bookings_path: "/Booking/Index"      # env: PORTAL_BOOKINGS_PATH (optional)
  debug: false                         # env: PORTAL_DEBUG (true/false) — visible browser

# ── Claude AI — part matching (agent.py) and the weekly improve.py ─────────
anthropic:
  api_key: "YOUR_ANTHROPIC_KEY"        # env: ANTHROPIC_API_KEY

# ── MECA Parts Portal (pro.meca.se) — parts ordering ───────────────────────
parts_portal:
  username: "YOUR_PARTS_LOGIN"         # env: PARTS_PORTAL_USERNAME
  password: "YOUR_PARTS_PASSWORD"      # env: PARTS_PORTAL_PASSWORD

# ── Telegram bot (notifications + order approval) — required ───────────────
# Create the bot with @BotFather, send it a message, then fill in both values.
# chat_id must be YOUR PRIVATE chat id (a positive number); never use a group.
# Only taps from this private chat are accepted as approvals.
telegram:
  bot_token: "YOUR_TELEGRAM_BOT_TOKEN"   # env: TELEGRAM_BOT_TOKEN
  chat_id: "YOUR_TELEGRAM_CHAT_ID"       # env: TELEGRAM_CHAT_ID

name: MECA Booking Agent

# Runs once a day, Mon-Sat. Cron is in UTC: 15:00 UTC = 17:00 Swedish summer
# time (CEST) / 16:00 winter time (CET). The approval poller (approve.yml) runs
# once a day at 06:00 UTC, far from this run, so the two never queue together.
on:
  schedule:
    - cron: "0 15 * * 1-6"
  workflow_dispatch:               # allow manual runs from the Actions tab

# Don't let two runs overlap (they both push state back to main).
concurrency:
  group: meca-bookings
  cancel-in-progress: false

permissions:
  contents: write                  # needed to commit seen_ids / run history back

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      # Step timeout below the job's 15 min: a step timeout fails the step, so the
      # alert step's failure() fires (a job timeout is a cancel instead).
      - name: Run booking agent
        timeout-minutes: 13
        env:
          PORTAL_USERNAME:       ${{ secrets.PORTAL_USERNAME }}
          PORTAL_PASSWORD:       ${{ secrets.PORTAL_PASSWORD }}
          ANTHROPIC_API_KEY:     ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN:    ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:      ${{ secrets.TELEGRAM_CHAT_ID }}
          PARTS_PORTAL_USERNAME: ${{ secrets.PARTS_PORTAL_USERNAME }}
          PARTS_PORTAL_PASSWORD: ${{ secrets.PARTS_PORTAL_PASSWORD }}
        run: python agent.py

      # Clears this workflow's alerts (workflow_failed, run_failed, crash) after a good
      # run, including approve runs that stop after --check. Stdlib only, no secrets.
      - name: Mark OK
        if: ${{ success() }}
        env:
          WORKFLOW_NAME:      ${{ github.workflow }}
        run: python3 alerts_cli.py workflow-ok "$WORKFLOW_NAME"

      # Covers failures our Python code cannot report itself: a failed pip/playwright
      # install, the 13 min step timeout above (the step fails), the 15 min job timeout
      # (a cancel, hence cancelled(); a manual cancel alerts too) and a crash before
      # agent.py starts. Not sent when this run already raised a more specific alert
      # (alerts_cli suppression rule). Stdlib only: nothing needs installing. Runs
      # before the persist step so config/alerts.json is committed.
      - name: Alert on failure
        if: ${{ failure() || cancelled() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKFLOW_NAME:      ${{ github.workflow }}
        run: python3 alerts_cli.py workflow-failed "$WORKFLOW_NAME"

      - name: Persist state back to repo
        if: ${{ always() }}
        run: |
          git config user.name  "meca-agent[bot]"
          git config user.email "meca-agent[bot]@users.noreply.github.com"
          # One file per git add: a missing file must not stop the others being staged.
          for f in config/seen_ids.txt config/orders.json logs/run_history.jsonl \
                   config/no_button_ids.txt config/no_button_seen_once.txt config/alerts.json; do
            git add "$f" 2>/dev/null || true
          done
          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "chore: update booking state [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying."
            # Undo a half-done rebase; --abort also restores the autostash.
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "Could not push state after 3 attempts."
          exit 1

      # Logs only: screenshots (logs/*.png) show booking pages with customer data.
      - name: Upload logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: meca-logs-${{ github.run_id }}
          path: |
            logs/*.log
          if-no-files-found: ignore
          retention-days: 14

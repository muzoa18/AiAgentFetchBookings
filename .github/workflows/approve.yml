name: MECA Approval Poller

# Reads the owner's Telegram Approve/Cancel taps on staged parts orders, and
# Klar taps that mark a resolved booking Hanterad in the MECA portal
# (approve.py). Once a day at 06:00 UTC (08:00 Swedish summer time, 07:00
# winter time), every day of the week: the owner taps in the evening after the
# daily booking run and the order is placed the next morning. Every day (incl.
# Sunday) because Telegram only keeps unread button taps for 24 hours. Tap
# within ~36 h of the staging message: approvals older than 48 h expire, and
# expiry is checked at poll time. Run it by hand from the Actions tab
# ("Run workflow") to process a tap immediately.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

# Same group as bookings.yml: the two jobs must never overlap (shared
# config/orders.json, one pro.meca.se cart, agent.py's start-of-run sweep).
concurrency:
  group: meca-bookings
  cancel-in-progress: false

permissions:
  contents: write                  # commit config/orders.json back

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Stdlib only: nothing installed yet. Most runs stop here. has_pending is
      # true for an order awaiting approval, an outstanding Klar button, or a
      # placed order the order checker has not yet found in pro.meca.se
      # "Skickade Beställningar" (and not yet warned about).
      - name: Anything pending?
        id: check
        run: python approve.py --check

      - name: Install dependencies
        if: ${{ steps.check.outputs.has_pending == 'true' }}
        run: pip install -r requirements.txt

      - name: Install Chromium
        if: ${{ steps.check.outputs.has_pending == 'true' }}
        run: python -m playwright install --with-deps chromium

      - name: Handle approvals
        if: ${{ steps.check.outputs.has_pending == 'true' }}
        env:
          # PORTAL_*: the MECA portal login for a Klar tap (press Hanterad, then confirm);
          # config_loader requires them anyway.
          PORTAL_USERNAME:       ${{ secrets.PORTAL_USERNAME }}
          PORTAL_PASSWORD:       ${{ secrets.PORTAL_PASSWORD }}
          TELEGRAM_BOT_TOKEN:    ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:      ${{ secrets.TELEGRAM_CHAT_ID }}
          PARTS_PORTAL_USERNAME: ${{ secrets.PARTS_PORTAL_USERNAME }}
          PARTS_PORTAL_PASSWORD: ${{ secrets.PARTS_PORTAL_PASSWORD }}
          ANTHROPIC_API_KEY:     ${{ secrets.ANTHROPIC_API_KEY }}
        run: python approve.py

      - name: Persist state back to repo
        if: ${{ always() }}
        run: |
          git config user.name  "meca-agent[bot]"
          git config user.email "meca-agent[bot]@users.noreply.github.com"
          git add config/orders.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "chore: update order state [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying."
            # Undo a half-done rebase; --abort also restores the autostash.
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "Could not push state after 3 attempts."
          exit 1

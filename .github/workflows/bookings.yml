name: MECA Booking Agent

# Runs once a day, Mon-Sat. Cron is in UTC: 15:00 UTC = 17:00 Swedish summer
# time (CEST) / 16:00 winter time (CET). The approval poller (approve.yml) runs
# once a day at 06:00 UTC, far from this run, so the two never queue together.
on:
  schedule:
    - cron: "0 15 * * 1-6"
  workflow_dispatch:               # allow manual runs from the Actions tab

# Don't let two runs overlap (they both push state back to main).
concurrency:
  group: meca-bookings
  cancel-in-progress: false

permissions:
  contents: write                  # needed to commit seen_ids / run history back

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run booking agent
        env:
          PORTAL_USERNAME:       ${{ secrets.PORTAL_USERNAME }}
          PORTAL_PASSWORD:       ${{ secrets.PORTAL_PASSWORD }}
          ANTHROPIC_API_KEY:     ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN:    ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:      ${{ secrets.TELEGRAM_CHAT_ID }}
          PARTS_PORTAL_USERNAME: ${{ secrets.PARTS_PORTAL_USERNAME }}
          PARTS_PORTAL_PASSWORD: ${{ secrets.PARTS_PORTAL_PASSWORD }}
        run: python agent.py

      - name: Persist state back to repo
        if: ${{ always() }}
        run: |
          git config user.name  "meca-agent[bot]"
          git config user.email "meca-agent[bot]@users.noreply.github.com"
          git add config/seen_ids.txt config/orders.json logs/run_history.jsonl 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "chore: update booking state [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying."
            # Undo a half-done rebase; --abort also restores the autostash.
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "Could not push state after 3 attempts."
          exit 1

      - name: Upload logs & screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: meca-logs-${{ github.run_id }}
          path: |
            logs/*.log
            logs/*.png
          if-no-files-found: ignore
          retention-days: 14
